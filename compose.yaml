name: job-radar

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_DB: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 10s
      retries: 6
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.4", memory: 512M }

  crawler:
    build: .
    image: job-radar:local
    restart: unless-stopped
    # Chromium leaves crashpad/renderer children; tini reaps them so they do not pile up as zombies.
    init: true
    env_file: .env
    environment:
      # Most tasks wait on other sites, not on CPU; eight at a time by default. Override for a one-off backlog run:
      # CRAWLER_CONCURRENCY=16 docker compose up -d crawler (tools/backlog-boost.sh does this and reverts).
      # A separate name, so a WORKER_CONCURRENCY line left in .env cannot override it.
      WORKER_CONCURRENCY: "${CRAWLER_CONCURRENCY:-8}"
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, traefik-network]
    deploy:
      resources:
        limits: { cpus: "0.8", memory: 1280M }

  # The screens and their API. Tailnet-only: DNS points at oracle's tailnet address and Traefik only
  # accepts tailnet sources, so the public IP with this Host header gets 403.
  web:
    image: job-radar:local
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    command: ["node", "dist/src/server.js"]
    depends_on:
      db: { condition: service_healthy }
      crawler: { condition: service_started }
    networks: [internal, traefik-network]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-network
      traefik.http.routers.job-radar.rule: Host(`jobs.docaohieu.com`)
      traefik.http.routers.job-radar.entrypoints: websecure
      traefik.http.routers.job-radar.tls: "true"
      traefik.http.routers.job-radar.middlewares: job-radar-tailnet@docker,app-chain@file
      traefik.http.middlewares.job-radar-tailnet.ipallowlist.sourcerange: 100.64.0.0/10
      traefik.http.routers.job-radar.service: job-radar
      traefik.http.services.job-radar.loadbalancer.server.port: "8080"
      # Public read-only digest for a ChatGPT scheduled task (it cannot join the tailnet). Only /feed/ is routed on
      # this host, and the app answers 404 unless the path carries FEED_TOKEN; the screens and /api stay tailnet-only.
      traefik.http.routers.job-radar-feed.rule: Host(`jobs-feed.docaohieu.com`) && PathPrefix(`/feed/`)
      traefik.http.routers.job-radar-feed.entrypoints: websecure
      traefik.http.routers.job-radar-feed.tls: "true"
      traefik.http.routers.job-radar-feed.service: job-radar
      traefik.http.routers.job-radar-feed.middlewares: job-radar-feed-rate@docker,app-chain@file
      traefik.http.middlewares.job-radar-feed-rate.ratelimit.average: "30"
      traefik.http.middlewares.job-radar-feed-rate.ratelimit.period: "1m"
      traefik.http.middlewares.job-radar-feed-rate.ratelimit.burst: "10"
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 256M }

  # Runs the test suite against a throwaway database on the same Postgres: `docker compose run --rm test`.
  test:
    build: { context: ., target: build }
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgres://jobradar:${POSTGRES_PASSWORD}@db:5432/jobradar_test
    command: ["npx", "vitest", "run"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  db-data:

networks:
  internal:
  traefik-network:
    external: true
