name: job-radar

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_DB: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 10s
      retries: 6
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  crawler:
    build: .
    image: job-radar:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, traefik-network]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1536M }

  # Runs the test suite against a throwaway database on the same Postgres: `docker compose run --rm test`.
  test:
    build: { context: ., target: build }
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgres://jobradar:${POSTGRES_PASSWORD}@db:5432/jobradar_test
    command: ["npx", "vitest", "run"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  db-data:

networks:
  internal:
  traefik-network:
    external: true
